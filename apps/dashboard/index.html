<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HSI</title>
    <!-- Apply stored appearance before first paint to avoid flash -->
    <script>
      (function () {
        try {
          var root = document.documentElement
          var theme = null
          var raw = localStorage.getItem('appearance')
          if (raw !== null) {
            try {
              var a = JSON.parse(raw)
              if (a && typeof a.theme === 'string') theme = a.theme
            } catch (e) { /* malformed: use the legacy key */ }
          }
          if (theme === null) theme = localStorage.getItem('theme')
          if (theme && theme !== 'auto' && /^[a-z]+$/.test(theme)) root.setAttribute('data-theme', theme)
          var vars = JSON.parse(localStorage.getItem('appearance-vars') || '{}')
          for (var k in vars) {
            if (k.indexOf('--') === 0 && typeof vars[k] === 'string') root.style.setProperty(k, vars[k])
          }
        } catch (e) { /* storage unavailable or malformed: stay in Auto */ }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
