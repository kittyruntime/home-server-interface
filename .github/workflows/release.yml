name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to publish (ex: v1.0.0)"
        required: true

env:
  APP_NAME: hsi

permissions:
  contents: write

jobs:
  # Install, update, rollback, storage, network and recovery on disposable
  # VMs (#17, #38), on the pushed tag: a release is published only when they
  # all pass. Publishing an existing tag again by hand skips them.
  vm-tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/vm-tests.yml
    permissions:
      contents: read

  # One archive per architecture, each built and checked on its own kind of
  # runner: the runtime dependencies hold native modules (better-sqlite3, the
  # Prisma engines) that must match the machine that installs them.
  build:
    needs: vm-tests
    if: ${{ !cancelled() && (needs.vm-tests.result == 'success' || needs.vm-tests.result == 'skipped') }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.inputs.version }}

      - name: Resolve and validate version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_VERSION:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "Release tag does not exist: $TAG" >&2
            exit 1
          }
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/root-worker/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm verify

      - name: Build release archive (linux/${{ matrix.arch }})
        run: echo "ARCHIVE=$(scripts/build-release.sh "$VERSION" | tail -1)" >> "$GITHUB_ENV"

      - name: Check the archive on this architecture
        run: |
          [[ "$ARCHIVE" == *"-linux-${{ matrix.arch }}.tar.gz" ]]
          scripts/smoke-release.sh "$ARCHIVE"

      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.arch }}
          path: ${{ env.ARCHIVE }}
          retention-days: 3

  # Signs every archive in one SHA256SUMS (installers and workers check only
  # their own line) and publishes the release.
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.inputs.version }}

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_VERSION:-$REF_NAME}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true

      - name: Check both archives are there
        run: |
          for arch in amd64 arm64; do
            test -s "${APP_NAME}-v${VERSION}-linux-${arch}.tar.gz"
          done

      - name: Sign release
        env:
          HSI_RELEASE_SIGNING_KEY: ${{ secrets.HSI_RELEASE_SIGNING_KEY }}
        run: |
          scripts/sign-release.sh . \
            "${APP_NAME}-v${VERSION}-linux-amd64.tar.gz" \
            "${APP_NAME}-v${VERSION}-linux-arm64.tar.gz"

      - name: Extract changelog notes
        run: |
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "RELEASE_NOTES<<__EOF__"
            echo "$NOTES"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ env.APP_NAME }}-v${{ env.VERSION }}-linux-amd64.tar.gz
            ${{ env.APP_NAME }}-v${{ env.VERSION }}-linux-arm64.tar.gz
            install.sh
            SHA256SUMS
            SHA256SUMS.sig
          body: ${{ env.RELEASE_NOTES }}
