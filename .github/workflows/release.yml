name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag to publish (ex: v1.0.0)"
        required: true

env:
  APP_NAME: hsi

permissions:
  contents: write

jobs:
  # Install, update, rollback, storage, network and recovery on disposable
  # VMs (#17, #38), on the pushed tag: a release is published only when they
  # all pass. Publishing an existing tag again by hand skips them.
  vm-tests:
    if: github.event_name == 'push'
    uses: ./.github/workflows/vm-tests.yml
    permissions:
      contents: read

  release:
    needs: vm-tests
    if: ${{ !cancelled() && (needs.vm-tests.result == 'success' || needs.vm-tests.result == 'skipped') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pushed tag
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Checkout requested tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.inputs.version }}

      - name: Resolve and validate version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_VERSION:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "Release tag does not exist: $TAG" >&2
            exit 1
          }
          VERSION="${TAG#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $TAG does not match package.json version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/root-worker/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm verify

      - name: Assemble locked runtime dependencies
        run: |
          npm ci --prefix runtime --omit=dev --no-audit --no-fund
          PRISMA_CLI_BINARY_TARGETS=debian-openssl-3.0.x \
            node runtime/node_modules/@prisma/engines/scripts/postinstall.js
          test -x runtime/node_modules/@prisma/engines/schema-engine-debian-openssl-3.0.x
          test -s runtime/node_modules/better-sqlite3/build/Release/better_sqlite3.node
          test -s packages/database/src/generated/prisma/client.ts

      - name: Build root-worker (linux/amd64)
        run: |
          cd apps/root-worker
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.buildVersion=v${VERSION}" -o root-worker .

      - name: Build dashboard
        run: |
          echo "VITE_API_URL=/trpc" > apps/dashboard/.env.production
          pnpm --filter @app/dashboard run build

      - name: Package release
        env:
          APP_NAME: ${{ env.APP_NAME }}
        run: echo "ARCHIVE=$(scripts/package-release.sh "$VERSION")" >> "$GITHUB_ENV"

      - name: Sign release
        env:
          HSI_RELEASE_SIGNING_KEY: ${{ secrets.HSI_RELEASE_SIGNING_KEY }}
        run: scripts/sign-release.sh . "$ARCHIVE"

      - name: Extract changelog notes
        run: |
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          {
            echo "RELEASE_NOTES<<__EOF__"
            echo "$NOTES"
            echo "__EOF__"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            ${{ env.ARCHIVE }}
            install.sh
            SHA256SUMS
            SHA256SUMS.sig
          body: ${{ env.RELEASE_NOTES }}
