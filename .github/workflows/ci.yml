name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal token scope: CI only needs to read the repo to check out and build.
permissions:
  contents: read

# A new push to the same branch or PR supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/root-worker/go.mod
          cache-dependency-path: apps/root-worker/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release runtime lock
        run: npm ci --prefix runtime --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Lint (ESLint)
        run: pnpm lint

      - name: No unused files, exports or dependencies (knip)
        run: pnpm knip

      - name: Check UI strings are English
        run: scripts/check-i18n.sh

      - name: No em dashes
        run: scripts/check-no-em-dash.sh

      - name: Check and vet Go
        run: pnpm check:go

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/root-worker/go.mod
          cache-dependency-path: apps/root-worker/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @app/database db:generate

      - name: Test backend and root-worker
        run: pnpm test

      # The inventory rebuilds the schema of every published release (over a
      # minute); its output only moves with the database package.
      - name: Check whether the database package changed
        id: db
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE^{commit}" 2>/dev/null && git diff --quiet "$BASE" HEAD -- packages/database .github/workflows/ci.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify published SQLite inventory and conversion checksums
        if: steps.db.outputs.changed == 'true'
        run: |
          python3 packages/database/prisma/cutover/inventory.py
          python3 packages/database/prisma/cutover/generate-conversions.py
          git diff --exit-code -- packages/database/prisma/cutover/states.json packages/database/prisma/cutover/conversions.json packages/database/prisma/cutover/conversions
          test -z "$(git ls-files --others --exclude-standard packages/database/prisma/cutover/conversions)"

      - name: Test SQLite cutover and installer
        run: |
          pnpm test:shell

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/root-worker/go.mod
          cache-dependency-path: apps/root-worker/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Build root-worker
        run: cd apps/root-worker && CGO_ENABLED=0 go build -o root-worker .

      - name: Smoke-test backend artifact
        run: pnpm smoke:backend

  # The arm64 archive (Raspberry Pi 4 and 5 with a 64-bit OS), built and
  # checked on an arm64 runner: the tests, then the archive's worker and
  # native modules run on the architecture they ship for.
  arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/root-worker/go.mod
          cache-dependency-path: apps/root-worker/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: |
          pnpm --filter @app/database db:generate
          pnpm test

      - name: Build the arm64 release archive
        run: echo "ARCHIVE=$(scripts/build-release.sh "$(node -p 'require("./package.json").version')-ci" | tail -1)" >> "$GITHUB_ENV"

      - name: Check the archive on arm64
        run: |
          [[ "$ARCHIVE" == *-linux-arm64.tar.gz ]]
          scripts/smoke-release.sh "$ARCHIVE"
          pnpm smoke:backend

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @app/website...

      # Fails on broken internal links (starlight-links-validator).
      - name: Build documentation site
        run: pnpm --filter @app/website build
