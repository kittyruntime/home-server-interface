name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal token scope: CI only needs to read the repo to check out and build.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/root-worker/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release runtime lock
        run: npm ci --prefix runtime --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Check UI strings are English
        run: scripts/check-i18n.sh

      - name: No em dashes
        run: scripts/check-no-em-dash.sh

      - name: Check and vet Go
        run: pnpm check:go

      - name: Typecheck
        run: pnpm typecheck

      - name: Test backend and root-worker
        run: pnpm test

      - name: Verify published SQLite inventory and conversion checksums
        run: |
          python3 packages/database/prisma/cutover/inventory.py
          python3 packages/database/prisma/cutover/generate-conversions.py
          git diff --exit-code -- packages/database/prisma/cutover/states.json packages/database/prisma/cutover/conversions.json packages/database/prisma/cutover/conversions
          test -z "$(git ls-files --others --exclude-standard packages/database/prisma/cutover/conversions)"

      - name: Test SQLite cutover and installer
        run: |
          pnpm --filter @app/database exec tsx --test src/cutover/preflight.test.ts
          pnpm test:shell

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/root-worker/go.mod
          cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Build root-worker
        run: cd apps/root-worker && CGO_ENABLED=0 go build -o root-worker .

      - name: Smoke-test backend artifact
        run: pnpm smoke:backend

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @app/website...

      # Fails on broken internal links (starlight-links-validator).
      - name: Build documentation site
        run: pnpm --filter @app/website build
