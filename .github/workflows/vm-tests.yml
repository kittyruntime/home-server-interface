name: VM tests

# Installs and updates HSI on disposable KVM virtual machines (#17): a fresh
# install with reboot and a refused broken update, and an update from the
# latest published release with a rollback. See scripts/vm/suite.sh.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "scripts/install.sh"
      - "scripts/vm/**"
      - "scripts/package-release.sh"
      - "packages/database/**"
      - "apps/root-worker/**"
      - "runtime/**"
      - ".github/workflows/vm-tests.yml"

permissions:
  contents: read

concurrency:
  group: vm-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/root-worker/go.mod
          cache: false

      # A pre-release one patch above the source version: newer than the
      # published release it updates from, never mistaken for a real one.
      - name: Test version
        id: version
        run: |
          base=$(node -p 'require("./package.json").version')
          IFS=. read -r major minor patch <<<"$base"
          version="$major.$minor.$((patch + 1))-vmtest.${{ github.run_number }}"
          npm pkg set version="$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm --filter @app/database db:generate
          npm ci --prefix runtime --omit=dev --no-audit --no-fund
          PRISMA_CLI_BINARY_TARGETS=debian-openssl-3.0.x \
            node runtime/node_modules/@prisma/engines/scripts/postinstall.js
          (cd apps/root-worker && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.buildVersion=v${VERSION}" -o root-worker .)
          pnpm --filter @app/backend build
          echo "VITE_API_URL=/trpc" > apps/dashboard/.env.production
          pnpm --filter @app/dashboard run build
          scripts/package-release.sh "$VERSION"

      - uses: actions/upload-artifact@v5
        with:
          name: release
          path: hsi-v*-linux-amd64.tar.gz
          retention-days: 3

  vm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, update]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v5
        with:
          name: release

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          ls -l /dev/kvm
          qemu-img info "$(ls ~/.cache/hsi-vm/*.qcow2 2>/dev/null | head -1)" 2>/dev/null || true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/hsi-vm
          key: debian-13-cloud-${{ github.run_id }}
          restore-keys: debian-13-cloud-

      - name: Run ${{ matrix.scenario }}
        env:
          VM_DIR: ${{ runner.temp }}/vm
        run: scripts/vm/suite.sh "${{ matrix.scenario }}" "hsi-v${{ needs.build.outputs.version }}-linux-amd64.tar.gz" "${{ needs.build.outputs.version }}"

      - name: Keep the VM logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vm-${{ matrix.scenario }}-logs
          path: |
            ${{ runner.temp }}/vm/*.log
          retention-days: 7
