name: VM debug
on:
  push:
    branches: [test/vm-suite]
    paths: [".github/workflows/vm-debug.yml"]
jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils >/dev/null
          ls -l /dev/kvm; grep -m1 -o -E 'vmx|svm' /proc/cpuinfo || echo "no vmx/svm flag"; lscpu | grep -i -E "model name|virtualization|hypervisor"
          qemu-system-x86_64 --version | head -1
          curl -fsSL https://cloud.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2 -o base.qcow2
          for variant in "-enable-kvm" "-enable-kvm -cpu host" "-accel kvm -cpu max" "-machine q35 -enable-kvm" "-accel tcg"; do
            qemu-img create -q -f qcow2 -b "$PWD/base.qcow2" -F qcow2 sys.qcow2 20G
            rm -f console.log
            timeout 75 qemu-system-x86_64 $variant -m 2048 -smp 2 -drive file=sys.qcow2,if=virtio,format=qcow2 -display none -serial file:console.log -nic user > qemu.log 2>&1 || true
            echo "=== $variant: console $(wc -c < console.log) bytes, qemu: $(head -c 300 qemu.log)"
            tail -c 400 console.log | tr -d '\r' | tail -4; echo
          done
